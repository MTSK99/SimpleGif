<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SimpleGif">
<meta name="description" content="粘贴 X/Twitter 的 GIF 链接，转换成微信可以直接发送、可以加进表情库的 GIF。">
<title>推特 GIF 转微信</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="icon" href="/static/icon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="glow glow-a" aria-hidden="true"></div>
<div class="glow glow-b" aria-hidden="true"></div>

<main class="app">
  <header class="head">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="30" height="30">
        <path d="M13.2 8.2 L13.2 23.8 L23.6 16 Z"
              fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="sub">把推特的动图，变成微信能用的 GIF</p>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="card">
    <div class="field-row">
      <label class="field-label" for="link">推文链接 / GIF 直链</label>
      <button id="paste" class="btn-ghost btn-paste" type="button">粘贴</button>
    </div>
    <div class="input-wrap">
      <textarea id="link" rows="2" spellcheck="false" autocomplete="off" autocapitalize="off"
        placeholder="https://x.com/用户名/status/1234567890"></textarea>
    </div>
    <p class="hint" id="hint">支持 x.com / twitter.com 的推文链接，也支持 B 站、YouTube、微博等站的视频页地址和 twimg 直链。</p>

    <div class="profiles" id="profiles" role="group" aria-label="输出预设"></div>

    <details class="adv">
      <summary>高级设置</summary>
      <div class="adv-grid">
        <label class="adv-item">
          <span>宽度 px</span>
          <input id="opt-width" type="number" inputmode="numeric" min="80" max="1280" step="10">
        </label>
        <label class="adv-item">
          <span>帧率 fps</span>
          <input id="opt-fps" type="number" inputmode="numeric" min="4" max="30" step="1">
        </label>
        <label class="adv-item">
          <span>体积上限 MB</span>
          <input id="opt-maxmb" type="number" inputmode="decimal" min="0.3" max="25" step="0.1">
        </label>
        <label class="adv-item">
          <span>起始秒</span>
          <input id="opt-start" type="number" inputmode="decimal" min="0" max="600" step="0.5">
        </label>
        <label class="adv-item">
          <span>截取秒数（0=整段）</span>
          <input id="opt-duration" type="number" inputmode="decimal" min="0" max="60" step="0.5">
        </label>
        <label class="adv-item">
          <span>颜色数</span>
          <select id="opt-colors">
            <option value="256">256</option>
            <option value="128">128</option>
            <option value="64">64</option>
          </select>
        </label>
        <label class="adv-item adv-wide">
          <span>抖动算法</span>
          <select id="opt-dither">
            <option value="bayer">bayer（体积小）</option>
            <option value="sierra2_4a">sierra2_4a（观感好）</option>
            <option value="floyd_steinberg">floyd_steinberg</option>
            <option value="none">关闭抖动</option>
          </select>
        </label>
      </div>
      <p class="hint">体积超过上限时会自动降帧率、降宽度重试，最多 6 轮。</p>
    </details>

    <button id="go" class="btn-primary" type="button">
      <span id="go-text">生成微信 GIF</span>
    </button>
  </section>

  <section class="card progress-card" id="progress" hidden aria-live="polite">
    <div class="progress-head">
      <span id="stage">准备中</span>
      <span id="pct">0%</span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <p class="hint" id="pmsg"></p>
  </section>

  <section class="card error-card" id="error" hidden>
    <h2>这次没成功</h2>
    <p id="errmsg"></p>
    <button id="retry" class="btn-ghost" type="button">重新试一次</button>
  </section>

  <section class="card result-card" id="result" hidden>
    <div class="result-head">
      <h2>做好了</h2>
      <span class="badge" id="r-badge">0KB</span>
    </div>
    <div class="preview">
      <img id="r-img" alt="生成的 GIF 预览">
    </div>
    <div class="meta" id="r-meta"></div>
    <div class="actions">
      <a id="r-dl" class="btn-primary" download="wechat.gif">保存到手机</a>
    </div>
    <p class="hint" id="r-warn" hidden></p>
    <div class="guide">
      <h3>放进微信</h3>
      <ol id="r-guide"></ol>
    </div>
  </section>

  <footer class="foot">
    <p>链接只用于本次转换，不会入库保存；成品文件 6 小时后自动清理。</p>
  </footer>
</main>

<script id="profiles-data" type="application/json">{{ profiles|tojson }}</script>
<script>window.__DEFAULT_PROFILE__ = {{ default_profile|tojson }};</script>
<script src="/static/app.js"></script>
</body>
</html>
